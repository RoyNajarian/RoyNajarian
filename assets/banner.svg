<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Roy Najarian</title>
  <desc id="d">Développeur web et UX/UI designer, étudiant en BUT MMI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.2" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#DC2F2F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#DC2F2F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="bs"><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode in="bs"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <style>
    .title { font: italic 900 92px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: 1px; }
    .sub   { font: 600 19px 'Helvetica Neue', Arial, sans-serif; fill: #BDBDBD; letter-spacing: 8px; }
    .speed { stroke: #DC2F2F; stroke-width: 2; stroke-linecap: round; opacity: .35; animation: speed 2.6s linear infinite; }
    .s2 { animation-delay: .5s; } .s3 { animation-delay: 1.1s; } .s4 { animation-delay: 1.7s; } .s5 { animation-delay: 2.1s; }
    .progress { transform-origin: 90px 197px; animation: fill 2.6s cubic-bezier(.65,0,.35,1) both; }
    @keyframes fill  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes speed { 0% { transform: translateX(180px); opacity: 0; } 30% { opacity: .55; } 100% { transform: translateX(-280px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#halo)"/>
    <g fill="#DC2F2F">
      <polygon points="1010,0 1060,0 960,340 910,340" opacity=".10"/>
      <polygon points="1075,0 1095,0 995,340 975,340" opacity=".16"/>
      <polygon points="1110,0 1200,0 1200,40 1100,340 1010,340" opacity=".06"/>
    </g>

    <g>
      <line class="speed"    x1="900" y1="70"  x2="1080" y2="70"/>
      <line class="speed s2" x1="960" y1="105" x2="1100" y2="105"/>
      <line class="speed s3" x1="880" y1="140" x2="1020" y2="140"/>
      <line class="speed s4" x1="980" y1="290" x2="1120" y2="290"/>
      <line class="speed s5" x1="920" y1="310" x2="1040" y2="310"/>
    </g>

    <text class="title" x="86" y="155" filter="url(#glow)">ROY NAJARIAN</text>

    <line x1="90" y1="197" x2="1110" y2="197" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line class="progress" x1="90" y1="197" x2="520" y2="197" stroke="#DC2F2F" stroke-width="6" stroke-linecap="round" filter="url(#redGlow)"/>
    <circle cx="90" cy="197" r="11" fill="#DC2F2F" filter="url(#redGlow)"/>

    <text class="sub" x="92" y="253">DÉVELOPPEUR WEB - UX/UI DESIGNER</text>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#DC2F2F" stroke-opacity=".7" stroke-width="2"/>
</svg>
